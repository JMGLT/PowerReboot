name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Inspect APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/debug/*.apk | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-label:)"

      - name: Name the APK
        id: apk
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/*.apk "PowerReboot_${VER}.apk"
          echo "file=PowerReboot_${VER}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PowerReboot-debug
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          Fork of [RebootNya](https://github.com/daisukiKaffuChino/RebootNya) that runs on **Android 8.0 (API 26) and newer**.

          ### Install
          Download **PowerReboot_${VER}.apk** below and install it. It works with Root or Shizuku.

          ### Notes
          - Installs alongside the original RebootNya (different package: \`io.github.jmglt.powerreboot\`).
          - Debug-signed build: to update to a later version you may need to uninstall this one first.
          - Based on upstream RebootNya 1.9.0 (Apache-2.0).
          EOF
          FILE="${{ steps.apk.outputs.file }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release already created from the web UI: just attach the APK.
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" \
              --title "PowerReboot ${VER}" --notes-file notes.md --latest
          fi
