name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Inspect APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/debug/*.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:)"

      - name: Name the APK
        id: apk
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/*.apk "PowerReboot_${VER}.apk"
          echo "file=PowerReboot_${VER}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PowerReboot-debug
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "PowerReboot ${GITHUB_REF_NAME#v} (Android 8.0+)" \
            --notes "Fork of RebootNya for Android 8.0 (API 26) and newer. Debug-signed build."
